<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hozu Zona — FilmPort</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #08080b;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* HEADER */
        header {
            height: 70px;
            background: #0e0e12;
            border-bottom: 1px solid #24242b;

            display: flex;
            align-items: center;
            padding: 0 20px;
        }

        .logo {
            color: #ffffff;
            text-decoration: none;
            font-size: 25px;
            font-weight: 800;
        }

        .logo span {
            color: #e50914;
        }

        /* MAIN */
        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 25px 20px 50px;
        }

        /* VIDEO AREA */
        .player {
            width: 100%;
            aspect-ratio: 16 / 9;

            background: #000;
            border: 1px solid #292930;
            border-radius: 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
            margin-bottom: 25px;
        }

        .no-video {
            text-align: center;
            color: #777780;
            padding: 20px;
        }

        .no-video .icon {
            font-size: 45px;
            margin-bottom: 10px;
            color: #44444c;
        }

        .no-video p {
            font-size: 15px;
        }

        /* TITLE */
        h1 {
            font-size: 36px;
            margin-bottom: 18px;
        }

        /* INFO */
        .info {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 35px;
        }

        .badge {
            background: #15151b;
            border: 1px solid #292930;
            border-radius: 8px;
            padding: 10px 15px;
            color: #d0d0d5;
            font-size: 15px;
        }

        .imdb {
            color: #ffd700;
        }

        /* DESCRIPTION */
        .section-title {
            font-size: 25px;
            margin-bottom: 12px;
        }

        .description {
            color: #b9b9c0;
            font-size: 17px;
            line-height: 1.8;
            margin-bottom: 35px;
        }

        /* BACK BUTTON */
        .back {
            display: inline-block;
            background: #e50914;
            color: white;

            text-decoration: none;
            font-weight: bold;

            padding: 13px 20px;
            border-radius: 9px;

            transition: 0.2s;
        }

        .back:hover {
            background: #b80710;
        }

        /* FOOTER */
        footer {
            border-top: 1px solid #24242b;
            background: #0e0e12;

            text-align: center;
            padding: 25px 15px;

            color: #66666f;
            font-size: 14px;
        }

        /* MOBILE */
        @media (max-width: 600px) {

            header {
                height: 60px;
                padding: 0 15px;
            }

            .logo {
                font-size: 22px;
            }

            .container {
                padding: 18px 15px 40px;
            }

            h1 {
                font-size: 30px;
            }

            .section-title {
                font-size: 22px;
            }

            .description {
                font-size: 16px;
            }

            .player {
                border-radius: 10px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>
        <a href="index.html" class="logo">
            Film<span>Port</span>
        </a>
    </header>


    <!-- MAIN -->
    <main class="container">

        <!-- MOVIE TITLE -->

        <!-- MOVIE INFO -->
        <div class="info">

            <div class="badge">
                🎬 Film

            <div class="badge">
                2026

</body>
</html>
